server.port=${PORT:8080}
# Values can be overridden with environment variables (DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, ADMIN_PASSWORD)
# Machine-specific secrets go in application-local.properties (git-ignored; copy application-local.properties.example)
spring.config.import=optional:classpath:application-local.properties
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edumanager?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
# Controllers read lazy relations (payment.student, class.teacher) while building responses
spring.jpa.open-in-view=true
# No default on purpose: set JWT_SECRET (32+ chars) or put it in application-local.properties
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://localhost:4173
spring.jackson.serialization.write-dates-as-timestamps=false
# Set to true to fill an empty database with sample teachers/students/payments on startup
app.seed-demo-data=false
# Password for the "admin" account created on first start; if blank a random one is generated and printed once
app.admin-password=${ADMIN_PASSWORD:}
